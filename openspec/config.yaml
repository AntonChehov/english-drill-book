schema: spec-driven

context: |
  English Drill Book: an offline-first PWA (Vue 3, TypeScript, Vite) for Russian speakers learning English from grammar workbooks they own.
  Interface text is Russian; repository text, specs and code are English; requirements and their IDs are in docs/product/.
  The repository never contains text from a published textbook (constitution C-01).

rules:
  proposal:
    - Read docs/process.md and the files of docs/product/ that the change touches. List the requirement IDs it delivers, and state what is left for later. At most 400 words (300 for the schema lite).
    - One change is one pull request; if it cannot be reviewed in one sitting, split it.
  specs:
    - 'Start every requirement title with its ID, for example "### Requirement: CHK-005 Correct answer".'
    - Use the wording of docs/product/ for the requirement; scenarios only for edge cases that docs/product/ does not state.
  design:
    - Omit design.md when the change is only texts (strings, demo content, translations) or only documentation, and for the schema lite; any other change has one.
    - Read docs/constitution.md. Decisions and rejected alternatives only, which constitution constraints the change touches and how each is measured; at most 1 000 words.
    - Record every new runtime dependency with what it replaces and its size (C-12).
  tasks:
    - At most 300 words. Every task group lands its own tests; tests name the requirement IDs they verify (@req ID).
    - Review, evidence and the archive commit are steps of docs/process.md, not tasks; the merge is the owner's act.

operations:
  apply:
    guidance:
      - Keep the layering of constitution C-08; put logic in src/domain as pure functions.
      - Do not edit docs/product/, docs/constitution.md, contracts/ or openspec/specs/ unless a task says so.
      - Commit in small steps with Conventional Commits messages.
