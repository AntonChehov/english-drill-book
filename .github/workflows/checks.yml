# The gates of the constitution for one commit (design D7), shared by the pull request
# and main workflows. Jobs run in parallel; the browser jobs run in the Playwright image,
# so no browser is downloaded per run. Every job leaves its results as an artifact for the
# evidence job: unit, size, dist, e2e-<browser or shard>, lighthouse, screenshots. The first
# step of `unit` and of `build`, `files`, says whether the pull request changes a file that a
# build or test reads; if not, the other steps of both are skipped, and so are the jobs after
# `build`: only `static` does work (workflow-retro D3, D4). No job runs before them, so the
# answer costs seconds, not a job. On main it always says yes.
name: Checks

on:
  workflow_call:
    inputs:
      ref:
        description: The commit to check.
        type: string
        required: true
      commitlint-from:
        description: The commit before the first one to lint; empty skips commitlint.
        type: string
        default: ""
    outputs:
      code:
        description: '"true" when the build and the tests ran, "false" when they were skipped.'
        value: ${{ jobs.build.outputs.code }}

permissions:
  contents: read
  # The step `files` of `unit` and `build` lists the files of the pull request.
  pull-requests: read

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  OPENSPEC_TELEMETRY: "0"

jobs:
  static:
    name: static
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          # commitlint reads the commits of the pull request. The depth is a string:
          # with a number, `cond && 0 || 1` would always give 1, since 0 is falsy.
          fetch-depth: ${{ inputs.commitlint-from != '' && '0' || '1' }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Types
        run: pnpm typecheck
      - name: Lint
        if: ${{ !cancelled() }}
        run: pnpm lint
      - name: Format
        if: ${{ !cancelled() }}
        run: pnpm format:check
      - name: OpenSpec
        if: ${{ !cancelled() }}
        run: pnpm spec
      - name: Traceability
        if: ${{ !cancelled() }}
        run: pnpm trace
      - name: Advisories
        if: ${{ !cancelled() }}
        run: pnpm audit
      - name: Commit messages
        if: ${{ !cancelled() && inputs.commitlint-from != '' }}
        env:
          FROM: ${{ inputs.commitlint-from }}
          TO: ${{ inputs.ref }}
        run: pnpm commitlint --from "$FROM" --to "$TO"

  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Files of the pull request
        id: files
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: node scripts/changes.mjs
      - uses: ./.github/actions/setup
        if: ${{ steps.files.outputs.code == 'true' }}
      - name: Unit tests with coverage of src/domain
        if: ${{ steps.files.outputs.code == 'true' }}
        run: pnpm test:coverage
      - name: Speed of the checker (CHK-014), without coverage instrumentation
        if: ${{ !cancelled() && steps.files.outputs.code == 'true' }}
        run: pnpm test:speed
      - name: Summary
        if: ${{ !cancelled() && steps.files.outputs.code == 'true' }}
        run: node scripts/junit.mjs "Unit tests" reports/unit-junit.xml
      - name: Summary of the speed tests
        if: ${{ !cancelled() && steps.files.outputs.code == 'true' }}
        run: node scripts/junit.mjs "Speed of the checker" reports/speed-junit.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.files.outputs.code == 'true' }}
        with:
          name: unit
          path: |
            reports/unit-junit.xml
            reports/speed-junit.xml
            reports/coverage/coverage-summary.json
          if-no-files-found: error
          retention-days: 7

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Files of the pull request
        id: files
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: node scripts/changes.mjs
      - uses: ./.github/actions/setup
        if: ${{ steps.files.outputs.code == 'true' }}
      - name: Production build
        if: ${{ steps.files.outputs.code == 'true' }}
        run: pnpm build
      - name: Bundle budgets
        if: ${{ steps.files.outputs.code == 'true' }}
        run: pnpm size
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ steps.files.outputs.code == 'true' }}
        with:
          name: dist
          path: dist
          # dist/.vite/manifest.json is read by scripts/size.mjs.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.files.outputs.code == 'true' }}
        with:
          name: size
          path: metrics.json
          if-no-files-found: error
          retention-days: 7

  e2e:
    name: e2e (${{ matrix.label }})
    needs: build
    if: ${{ needs.build.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --user 1001 --ipc=host
    strategy:
      fail-fast: false
      # The browsers run in parts side by side to keep the pipeline within C-19: WebKit, the
      # slowest, in three, Chromium and Firefox in two.
      matrix:
        include:
          - { project: chromium, shard: 1/2, label: chromium-1-of-2 }
          - { project: chromium, shard: 2/2, label: chromium-2-of-2 }
          - { project: firefox, shard: 1/2, label: firefox-1-of-2 }
          - { project: firefox, shard: 2/2, label: firefox-2-of-2 }
          - { project: webkit, shard: 1/3, label: webkit-1-of-3 }
          - { project: webkit, shard: 2/3, label: webkit-2-of-3 }
          - { project: webkit, shard: 3/3, label: webkit-3-of-3 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: End-to-end tests
        env:
          PROJECT: ${{ matrix.project }}
          SHARD: ${{ matrix.shard }}
          E2E_JUNIT_FILE: reports/e2e-${{ matrix.label }}.xml
        run: pnpm exec playwright test --project="$PROJECT" --shard="$SHARD"
      - name: Summary
        if: ${{ !cancelled() }}
        run: node scripts/junit.mjs "End-to-end tests (${{ matrix.label }})" "reports/e2e-${{ matrix.label }}.xml"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: e2e-${{ matrix.label }}
          path: reports/e2e-${{ matrix.label }}.xml
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ failure() }}
        with:
          name: playwright-report-${{ matrix.label }}
          path: reports/playwright
          retention-days: 7

  lighthouse:
    name: lighthouse
    needs: build
    if: ${{ needs.build.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --user 1001 --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Lighthouse, mobile profile
        run: pnpm lhci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: lighthouse
          # manifest.json holds the scores; the HTML reports are for people.
          path: reports/lighthouse
          if-no-files-found: error
          retention-days: 7

  screenshots:
    name: screenshots
    needs: build
    if: ${{ needs.build.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --user 1001 --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Screenshots of every view, both themes, two widths
        env:
          SCREENSHOTS_DIR: screenshots
        run: pnpm screenshots
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: error
          retention-days: 7
