# Removes the screenshot directories of closed pull requests from the evidence branch
# (design D8). Weekly, or by hand from the Actions tab.
name: Prune evidence

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

concurrency:
  group: prune-evidence
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prune:
    name: prune
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Bot token
        id: bot
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: Iv23ligy0dokJrSNvEjs
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: read
      - name: Prune closed pull requests
        env:
          EVIDENCE_TOKEN: ${{ steps.bot.outputs.token }}
        run: node scripts/evidence-branch.mjs prune
